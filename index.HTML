<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>VORA — Enfoque Diario</title>

  <!-- Configuración PWA para iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VORA" />
  <meta name="theme-color" content="#0b0d12" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><path d='M28 32 L50 72 L72 32' stroke='%2338bdf8' stroke-width='10' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />

  <style>
    /* ==========================================
       VORA — ESTILOS LIQUID GLASS (OSCURO / CLARO)
       ========================================== */
    :root {
      --bg-main: #0b0d12;
      --bg-glass: rgba(22, 27, 38, 0.72);
      --bg-card: rgba(30, 36, 51, 0.65);
      --border-glass: rgba(255, 255, 255, 0.1);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);

      --cat-estudio: #38bdf8;
      --cat-trabajo: #a855f7;
      --cat-personal: #10b981;
      --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    [data-theme="light"] {
      --bg-main: #f1f5f9;
      --bg-glass: rgba(255, 255, 255, 0.78);
      --bg-card: rgba(255, 255, 255, 0.85);
      --border-glass: rgba(15, 23, 42, 0.08);
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.18);
      --shadow-soft: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100dvh;
      transition: background-color 0.3s ease, color 0.3s ease;
      padding-bottom: 135px;
      overflow-x: hidden;
    }

    .ambient-glow {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 540px;
      margin: 0 auto;
    }

    /* HEADER LIQUID GLASS */
    .glass-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-glass);
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 18px 14px;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, var(--text-primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sync-pill {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 99px;
      border: 1px solid var(--border-glass);
      background: var(--bg-card);
      color: var(--text-secondary);
    }

    .sync-pill.synced {
      color: #10b981;
      border-color: rgba(16, 185, 129, 0.35);
    }

    .sync-pill.local {
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.35);
    }

    .date-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-transform: capitalize;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--border-glass);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 1rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* PROGRESO DIARIO */
    .progress-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 14px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .progress-track {
      height: 6px;
      background: rgba(148, 163, 184, 0.2);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #10b981);
      border-radius: 99px;
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* TIRA HORIZONTAL DE DÍAS */
    .days-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .days-strip::-webkit-scrollbar { display: none; }

    .day-pill {
      flex: 0 0 auto;
      min-width: 58px;
      padding: 8px 10px;
      border-radius: 14px;
      border: 1px solid var(--border-glass);
      background: var(--bg-card);
      color: var(--text-secondary);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-pill.active {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .day-pill .day-name {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.85;
    }

    .day-pill .day-num {
      display: block;
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 2px;
    }

    /* TIMELINE DE TAREAS */
    .timeline-container {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 55px 20px;
      color: var(--text-secondary);
    }

    .empty-state span {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 10px;
    }

    .task-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-left: 4px solid var(--cat-estudio);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow-soft);
      transition: all 0.25s ease;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-card[data-cat="trabajo"] { border-left-color: var(--cat-trabajo); }
    .task-card[data-cat="personal"] { border-left-color: var(--cat-personal); }

    .task-card.completed {
      opacity: 0.52;
      transform: scale(0.985);
    }

    .task-card.completed .task-title {
      text-decoration: line-through;
    }

    .check-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--text-secondary);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      color: #fff;
      transition: all 0.2s ease;
    }

    .task-card.completed .check-circle {
      background: #10b981;
      border-color: #10b981;
    }

    .task-body {
      flex: 1;
      min-width: 0;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-bottom: 3px;
    }

    .task-time {
      font-weight: 700;
      color: var(--accent);
    }

    .task-title {
      font-size: 0.98rem;
      font-weight: 500;
      word-wrap: break-word;
    }

    .task-actions {
      display: flex;
      gap: 6px;
    }

    .mini-btn {
      background: transparent;
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .mini-btn:active {
      background: var(--border-glass);
    }

    /* COMPOSER INFERIOR */
    .composer-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      max-width: 540px;
      margin: 0 auto;
      padding: 8px 14px calc(env(safe-area-inset-bottom, 12px) + 10px);
      background: linear-gradient(to top, var(--bg-main) 75%, transparent);
    }

    .quick-chips {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .chip, .time-chip {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      border-radius: 99px;
      padding: 5px 11px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip.active {
      border-color: var(--accent);
      color: var(--text-primary);
      background: var(--accent-glow);
    }

    .time-chip {
      color: var(--text-primary);
      outline: none;
    }

    .glass-composer {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-glass);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 6px 8px;
      box-shadow: var(--shadow-soft);
    }

    .glass-composer input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.95rem;
      padding: 8px 4px;
    }

    .mic-btn, .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      border: none;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .mic-btn {
      background: rgba(148, 163, 184, 0.14);
      color: var(--text-primary);
    }

    .mic-btn.recording {
      background: #ef4444;
      color: #fff;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .send-btn {
      background: var(--accent);
      color: #fff;
    }

    /* TOAST DE ALERTA 10 MIN ANTES */
    .alert-toast {
      position: fixed;
      top: calc(env(safe-area-inset-top, 16px) + 12px);
      left: 16px;
      right: 16px;
      max-width: 500px;
      margin: 0 auto;
      z-index: 100;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .alert-toast.hidden { display: none; }

    .alert-badge {
      background: var(--accent);
      color: #000;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 99px;
      display: inline-block;
      margin-bottom: 4px;
    }

    .alert-content strong { display: block; font-size: 0.95rem; }
    .alert-content small { color: #94a3b8; }

    .alert-close {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Fondo ambiental sutil -->
  <div class="ambient-glow"></div>

  <div class="app-container">
    <!-- HEADER -->
    <header class="glass-header">
      <div class="brand-row">
        <div>
          <div class="title-group">
            <h1 class="brand-title">VORA</h1>
            <span id="syncStatus" class="sync-pill local">Local</span>
          </div>
          <p class="date-subtitle" id="currentDateLabel">Cargando fecha...</p>
        </div>
        <div class="header-actions">
          <button id="notifPermBtn" class="icon-btn" title="Activar alertas">🔔</button>
          <button id="themeToggleBtn" class="icon-btn" title="Cambiar tema">☀️</button>
        </div>
      </div>

      <!-- Barra de Progreso Diaria -->
      <div class="progress-card">
        <div class="progress-info">
          <span id="progressText">0 de 0 completadas</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <!-- Tira Horizontal de Días -->
      <div class="days-strip" id="daysStrip"></div>
    </header>

    <!-- TIMELINE DE TAREAS -->
    <main class="timeline-container" id="timelineContainer"></main>
  </div>

  <!-- BARRA FLOTANTE DE CREACIÓN RÁPIDA (VOZ + TEXTO) -->
  <div class="composer-wrapper">
    <div class="quick-chips">
      <button type="button" class="chip active" data-cat="estudio">🔵 Estudio</button>
      <button type="button" class="chip" data-cat="trabajo">🟣 Trabajo</button>
      <button type="button" class="chip" data-cat="personal">🟢 Personal</button>
      <input type="time" id="manualTimeInput" class="time-chip" title="Hora opcional" />
    </div>

    <form id="taskForm" class="glass-composer">
      <button type="button" id="voiceBtn" class="mic-btn" title="Dictar por voz">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </button>

      <input
        type="text"
        id="taskInput"
        placeholder="Ej: Estudiar cálculo mañana 4pm..."
        autocomplete="off"
        required
      />

      <button type="submit" class="send-btn" title="Agregar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </form>
  </div>

  <!-- BANNER DE ALERTA INTERNA (10 MIN ANTES) -->
  <div id="inAppAlert" class="alert-toast hidden">
    <div class="alert-content">
      <span class="alert-badge">⏰ En 10 min</span>
      <strong id="alertTaskTitle">Tarea próxima</strong>
      <small id="alertTaskTime">16:00</small>
    </div>
    <button id="closeAlertBtn" class="alert-close">OK</button>
  </div>

  <script type="module">
    /* ==========================================
       VORA — FIREBASE FIRESTORE + LÓGICA
       ========================================== */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      writeBatch
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    // ⚠️ PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE
   const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBPx5AwL56vczET5VeCCLqaQzaMghcESWc",
  authDomain: "vora-b82b0.firebaseapp.com",
  projectId: "vora-b82b0",
  storageBucket: "vora-b82b0.firebasestorage.app",
  messagingSenderId: "47305835483",
  appId: "1:47305835483:web:970cd8b4f877e66f16ddfe",
  measurementId: "G-EFVY56QVDX"
};

    const COLLECTION_NAME = 'vora_tasks';
    const STORAGE_KEY = 'vora_tasks_v1';
    const THEME_KEY = 'vora_theme_v1';

    let db = null;
    let cloudEnabled = false;
    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let selectedDateStr = getLocalDateStr(new Date());
    let selectedCategory = 'estudio';

    const daysStrip = document.getElementById('daysStrip');
    const timelineContainer = document.getElementById('timelineContainer');
    const currentDateLabel = document.getElementById('currentDateLabel');
    const progressText = document.getElementById('progressText');
    const progressPercent = document.getElementById('progressPercent');
    const progressFill = document.getElementById('progressFill');
    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const manualTimeInput = document.getElementById('manualTimeInput');
    const voiceBtn = document.getElementById('voiceBtn');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const notifPermBtn = document.getElementById('notifPermBtn');
    const syncStatus = document.getElementById('syncStatus');

    function getLocalDateStr(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addDays(dateStr, days) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + days);
      return getLocalDateStr(dt);
    }

    function setSyncBadge(mode) {
      syncStatus.classList.remove('synced', 'local');
      if (mode === 'synced') {
        syncStatus.textContent = '☁️ Nube';
        syncStatus.classList.add('synced');
      } else {
        syncStatus.textContent = '📱 Local';
        syncStatus.classList.add('local');
      }
    }

    // --- INICIALIZACIÓN FIREBASE ---
    async function initCloudSync() {
      if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith('TU_')) {
        setSyncBadge('local');
        return;
      }

      try {
        const app = initializeApp(FIREBASE_CONFIG);
        db = getFirestore(app);
        cloudEnabled = true;

        // Si había tareas locales previas, subirlas si aún no están en la nube
        const tasksRef = collection(db, COLLECTION_NAME);

        onSnapshot(tasksRef, async (snapshot) => {
          setSyncBadge('synced');
          const cloudTasks = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));

          // Migrar tareas locales iniciales si la nube está vacía
          if (cloudTasks.length === 0 && tasks.length > 0) {
            const batch = writeBatch(db);
            tasks.forEach(t => {
              batch.set(doc(db, COLLECTION_NAME, t.id), t);
            });
            await batch.commit();
            return;
          }

          tasks = cloudTasks;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          renderTimeline();
        }, (err) => {
          console.error('Error de Firestore:', err);
          setSyncBadge('local');
        });
      } catch (err) {
        console.error('Error iniciando Firebase:', err);
        setSyncBadge('local');
      }
    }

    function init() {
      applySavedTheme();
      renderDaysStrip();
      renderTimeline();
      setupVoiceRecognition();
      startReminderWatcher();
      initCloudSync();
    }

    // --- TEMA OSCURO / CLARO ---
    function applySavedTheme() {
      const saved = localStorage.getItem(THEME_KEY) || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      themeToggleBtn.textContent = saved === 'dark' ? '☀️' : '🌙';
    }

    themeToggleBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem(THEME_KEY, next);
      themeToggleBtn.textContent = next === 'dark' ? '☀️' : '🌙';
    });

    // --- TIRA DE DÍAS ---
    function renderDaysStrip() {
      daysStrip.innerHTML = '';
      const today = new Date();
      const dayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

      for (let i = 0; i < 14; i++) {
        const dt = new Date(today);
        dt.setDate(today.getDate() + i);
        const dateStr = getLocalDateStr(dt);

        const pill = document.createElement('button');
        pill.type = 'button';
        pill.className = `day-pill ${dateStr === selectedDateStr ? 'active' : ''}`;

        let label = dayNames[dt.getDay()];
        if (i === 0) label = 'Hoy';
        if (i === 1) label = 'Mañana';

        pill.innerHTML = `
          <span class="day-name">${label}</span>
          <span class="day-num">${dt.getDate()}</span>
        `;

        pill.addEventListener('click', () => {
          selectedDateStr = dateStr;
          renderDaysStrip();
          renderTimeline();
        });

        daysStrip.appendChild(pill);
      }

      const [y, m, d] = selectedDateStr.split('-').map(Number);
      const selObj = new Date(y, m - 1, d);
      currentDateLabel.textContent = selObj.toLocaleDateString('es-ES', {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
      });
    }

    // --- PARSER INTELIGENTE ---
    function parseSmartInput(rawText) {
      let text = rawText.trim();
      let targetDate = selectedDateStr;
      let time = manualTimeInput.value || '';
      let category = selectedCategory;

      if (/#trabajo|\btrabajo\b|\bproyecto\b|\breunión\b/i.test(text)) {
        category = 'trabajo';
        text = text.replace(/#trabajo/gi, '').trim();
      } else if (/#estudio|\bestudiar\b|\bexamen\b|\btarea\b|\bclase\b/i.test(text)) {
        category = 'estudio';
        text = text.replace(/#estudio/gi, '').trim();
      } else if (/#personal|\bgym\b|\bcita\b|\bmédico\b/i.test(text)) {
        category = 'personal';
        text = text.replace(/#personal/gi, '').trim();
      }

      const todayStr = getLocalDateStr(new Date());
      if (/\bpasado mañana\b/i.test(text)) {
        targetDate = addDays(todayStr, 2);
        text = text.replace(/\bpasado mañana\b/gi, '').trim();
      } else if (/\bmañana\b/i.test(text)) {
        targetDate = addDays(todayStr, 1);
        text = text.replace(/\bmañana\b/gi, '').trim();
      } else if (/\bhoy\b/i.test(text)) {
        targetDate = todayStr;
        text = text.replace(/\bhoy\b/gi, '').trim();
      }

      const timeRegex = /(?:a las\s*)?(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?\b/i;
      const match = text.match(timeRegex);

      if (match && !time) {
        let hours = parseInt(match[1], 10);
        const minutes = match[2] ? parseInt(match[2], 10) : 0;
        const meridiem = match[3] ? match[3].toLowerCase().replace(/\./g, '') : null;

        if (hours >= 0 && hours <= 23 && minutes >= 0 && minutes <= 59) {
          if (meridiem === 'pm' && hours < 12) hours += 12;
          if (meridiem === 'am' && hours === 12) hours = 0;

          if (match[0].toLowerCase().includes('a las') || match[2] || meridiem) {
            time = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            text = text.replace(match[0], '').trim();
          }
        }
      }

      text = text.replace(/\s+(a las|el|para)$/i, '').trim();
      if (!text) text = rawText.trim();

      return { title: text, date: targetDate, time: time || 'Sin hora', category };
    }

    // --- OPERACIONES CRUD (LOCAL + FIRESTORE) ---
    async function addTaskToStore(task) {
      tasks.push(task);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      if (cloudEnabled && db) {
        await setDoc(doc(db, COLLECTION_NAME, task.id), task);
      }
    }

    async function updateTaskInStore(taskId, patch) {
      tasks = tasks.map(t => (t.id === taskId ? { ...t, ...patch } : t));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      if (cloudEnabled && db) {
        await updateDoc(doc(db, COLLECTION_NAME, taskId), patch);
      }
    }

    async function deleteTaskFromStore(taskId) {
      tasks = tasks.filter(t => t.id !== taskId);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      if (cloudEnabled && db) {
        await deleteDoc(doc(db, COLLECTION_NAME, taskId));
      }
    }

    // --- CREAR TAREA ---
    taskForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const raw = taskInput.value.trim();
      if (!raw) return;

      const parsed = parseSmartInput(raw);

      const newTask = {
        id: Date.now().toString(),
        title: parsed.title.charAt(0).toUpperCase() + parsed.title.slice(1),
        date: parsed.date,
        time: parsed.time,
        category: parsed.category,
        completed: false,
        notified: false,
        createdAt: Date.now()
      };

      selectedDateStr = newTask.date;
      taskInput.value = '';
      manualTimeInput.value = '';
      renderDaysStrip();

      await addTaskToStore(newTask);
      renderTimeline();
    });

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        selectedCategory = chip.dataset.cat;
      });
    });

    // --- RENDERIZAR TIMELINE ---
    function renderTimeline() {
      const dayTasks = tasks
        .filter(t => t.date === selectedDateStr)
        .sort((a, b) => {
          if (a.time === 'Sin hora') return 1;
          if (b.time === 'Sin hora') return -1;
          return a.time.localeCompare(b.time);
        });

      const total = dayTasks.length;
      const done = dayTasks.filter(t => t.completed).length;
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      progressText.textContent = `${done} de ${total} completadas`;
      progressPercent.textContent = `${pct}%`;
      progressFill.style.width = `${pct}%`;

      timelineContainer.innerHTML = '';

      if (dayTasks.length === 0) {
        timelineContainer.innerHTML = `
          <div class="empty-state">
            <span>✨</span>
            <p>Tu día está despejado.<br>Escribe o dicta una tarea abajo para organizarte.</p>
          </div>
        `;
        return;
      }

      const catLabels = {
        estudio: 'Estudio',
        trabajo: 'Trabajo',
        personal: 'Personal'
      };

      dayTasks.forEach(task => {
        const card = document.createElement('div');
        card.className = `task-card ${task.completed ? 'completed' : ''}`;
        card.dataset.cat = task.category;

        card.innerHTML = `
          <button class="check-circle" aria-label="Completar">${task.completed ? '✓' : ''}</button>
          <div class="task-body">
            <div class="task-meta">
              <span class="task-time">${task.time}</span>
              <span>• ${catLabels[task.category]}</span>
            </div>
            <div class="task-title">${escapeHTML(task.title)}</div>
          </div>
          <div class="task-actions">
            ${!task.completed ? `<button class="mini-btn defer-btn" title="Pasar a mañana">↪ Mañana</button>` : ''}
            <button class="mini-btn del-btn" title="Eliminar">✕</button>
          </div>
        `;

        card.querySelector('.check-circle').addEventListener('click', async () => {
          await updateTaskInStore(task.id, { completed: !task.completed });
          renderTimeline();
        });

        const deferBtn = card.querySelector('.defer-btn');
        if (deferBtn) {
          deferBtn.addEventListener('click', async () => {
            await updateTaskInStore(task.id, {
              date: addDays(task.date, 1),
              notified: false
            });
            renderTimeline();
          });
        }

        card.querySelector('.del-btn').addEventListener('click', async () => {
          await deleteTaskFromStore(task.id);
          renderTimeline();
        });

        timelineContainer.appendChild(card);
      });
    }

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    // --- VOZ ---
    function setupVoiceRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        voiceBtn.style.display = 'none';
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      voiceBtn.addEventListener('click', () => {
        try {
          recognition.start();
          voiceBtn.classList.add('recording');
          taskInput.placeholder = 'Escuchando...';
        } catch (e) {
          recognition.stop();
        }
      });

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        taskInput.value = transcript;
        voiceBtn.classList.remove('recording');
        taskInput.placeholder = 'Ej: Estudiar cálculo mañana 4pm...';
        taskForm.dispatchEvent(new Event('submit'));
      };

      recognition.onerror = () => {
        voiceBtn.classList.remove('recording');
        taskInput.placeholder = 'Ej: Estudiar cálculo mañana 4pm...';
      };

      recognition.onend = () => {
        voiceBtn.classList.remove('recording');
      };
    }

    // --- ALERTAS 10 MINUTOS ANTES ---
    notifPermBtn.addEventListener('click', async () => {
      if ('Notification' in window) {
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          playSoftChime();
          alert('✅ Alertas activadas. Te avisaré 10 minutos antes de tus tareas.');
        }
      }
    });

    function startReminderWatcher() {
      setInterval(async () => {
        const now = new Date();
        const todayStr = getLocalDateStr(now);

        for (const task of tasks) {
          if (task.completed || task.notified || task.date !== todayStr || task.time === 'Sin hora') continue;

          const [h, m] = task.time.split(':').map(Number);
          const taskTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
          const diffMinutes = (taskTime - now) / 60000;

          if (diffMinutes > 0 && diffMinutes <= 10) {
            await updateTaskInStore(task.id, { notified: true });
            triggerTaskReminder(task);
          }
        }
      }, 15000);
    }

    function triggerTaskReminder(task) {
      playSoftChime();
      const toast = document.getElementById('inAppAlert');
      document.getElementById('alertTaskTitle').textContent = task.title;
      document.getElementById('alertTaskTime').textContent = `Hora programada: ${task.time}`;
      toast.classList.remove('hidden');

      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(`⏰ VORA: En 10 min`, {
          body: `${task.title} (${task.time})`
        });
      }
    }

    document.getElementById('closeAlertBtn').addEventListener('click', () => {
      document.getElementById('inAppAlert').classList.add('hidden');
    });

    function playSoftChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) {}
    }

    init();
  </script>
</body>
